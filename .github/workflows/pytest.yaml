name: pytest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: Run pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Right-sized matrix (was 16 legs): the HACS floor, the latest stable,
        # and dev. Mid-range HA versions are intentionally not covered -- a
        # regression isolated to, e.g., 2025.6 would slip through; that is an
        # acceptable trade for a solo fork. Bump "latest stable" by hand at
        # release time.
        include:
          - core-version: "2024.12.5"  # hacs.json minimum supported HA
            python-version: "3.12.0"
          - core-version: "2026.7.4"   # latest stable
            python-version: "3.14.2"
          - core-version: "dev"        # early warning only (advisory; see continue-on-error)
            python-version: "3.14.2"
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install Home Assistant
        # The HA `dev` leg tracks an unstable upstream (it drops test files and
        # deps mid-cycle, e.g. requirements_test_all.txt / paho), so keep it a
        # non-blocking early-warning signal (step-level so the leg still reports
        # green) rather than a required gate.
        continue-on-error: ${{ matrix.core-version == 'dev' }}
        uses: ./.github/workflows/install_dependencies
        with:
          python-version: ${{ matrix.python-version }}
          core-version: ${{ matrix.core-version }}

      - name: Run pytest
        timeout-minutes: 60
        continue-on-error: ${{ matrix.core-version == 'dev' }}
        run: |
          export PYTHONPATH=${PYTHONPATH}:${PWD}
          source .venv/bin/activate
          cd core
          python3 -X dev -m pytest \
            -vvv \
            -qq \
            --timeout=9 \
            --durations=10 \
            --cov=homeassistant.components.adaptive_lighting \
            --cov-report=xml \
            -o console_output_style=count \
            -p no:sugar \
            tests/components/adaptive_lighting
