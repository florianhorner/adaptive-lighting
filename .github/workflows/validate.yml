name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate_hacs:
    runs-on: "ubuntu-latest"
    if: github.repository == 'florianhorner/adaptive-lighting'
    steps:
      - uses: "actions/checkout@v6"
      - name: HACS validation
        uses: "hacs/action@dcb30e72781db3f207d5236b861172774ab0b485" # main
        with:
          category: "integration"
          # This fork ships as a HACS *custom* repository, not via the default
          # store, so the default-store inclusion checks don't apply: `issues`
          # (Issues are intentionally disabled) and `topics` (no store listing).
          # The load-bearing checks (integration_manifest, hacsjson, brands)
          # still run.
          ignore: "issues topics"
