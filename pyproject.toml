[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-lighting"
version = "1.30.1"  # cosmetic; manifest.json is stamped from the git tag at release — see CONTRIBUTING.md
description = "Automatically adjust brightness and color of lights based on the sun position"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
docs = [
    "astral",
    "homeassistant",
    "markdown-code-runner>=2.7.0",
    "markdown-gfm-admonition",
    "pandas",
    "shinylive",
    "tabulate",
    "ulid-transform",
    "voluptuous",
    "zensical",
]
dev = [
    "homeassistant>=2024.12.5",
    "mypy",
    "pre-commit",
    "pytest-asyncio>=0.23,<1",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["custom_components/adaptive_lighting"]

# Ruff is configured in .ruff.toml (the single source of truth). A [tool.ruff]
# block here would be silently ignored by ruff when .ruff.toml exists, so it is
# intentionally absent to avoid a misleading, dead config.

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
